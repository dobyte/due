# 进程号
#pid = "./run/gate.pid"
# 统一时区设置。项目中的时间获取请使用xtime.Now()
timezone = "Local"

[pprof]
    # 监听地址
    addr = ":8089"

[cluster]
    [cluster.gate]
        # 实例ID，网关集群中唯一。不填写默认自动生成唯一的实例ID
        id = ""
        # 实例名称
        name = "gate"
        # RPC调用超时时间
        timeout = "1s"

[locate]
    [locate.redis]
        # 客户端连接地址
        addrs = ["127.0.0.1:6379"]
        # 数据库号
        db = 0
        # 用户名
        username = ""
        # 密码
        password = ""
        # 最大重试次数
        maxRetries = 3
        # key前缀
        prefix = "due"

[registry]
    [registry.nacos]
        # 服务端地址，默认为 http://127.0.0.1:8848/nacos，支持配置多个
        urls = ["http://127.0.0.1:8848/nacos"]
        # 命名空间ID，默认为空
        namespaceId = ""
        # 分组名称，默认为 DEFAULT_GROUP
        groupName = "DEFAULT_GROUP"
        # 集群名称，默认为 DEFAULT
        clusterName = "DEFAULT"
        # 请求超时时间，默认为10s
        timeout = "10s"
        # 心跳间隔时间，默认为5s
        heartbeat = "5s"
        # 用户名，默认为空
        username = ""
        # 密码，默认为空
        password = ""
        # 服务实例缓存目录
        cacheDir = "./run/nacos/naming/cache"
        # 日志目录
        logDir = "./run/nacos/naming/log"
        # 日志级别，可选：debug | info | warn | error，默认为 info
        logLevel = "info"

[network]
    [network.ws]
        [network.ws.server]
            # 服务器监听地址
            addr = ":3553"
            # 客户端连接路径
            path = "/"
            # 服务器最大连接数
            maxConnNum = 5000
            # 秘钥文件
            keyFile = ""
            # 证书文件
            certFile = ""
            # 跨域检测，空数组时不允许任何连接升级成websocket，未设置此参数时允许所有的链接升级成websocket
            origins = ["*"]
            # 握手超时时间，支持单位：纳秒（ns）、微秒（us | µs）、毫秒（ms）、秒（s）、分（m）、小时（h）、天（d）。默认为10s
            handshakeTimeout = "10s"
            # 心跳检测间隔时间。设置为0则不启用心跳检测，支持单位：纳秒（ns）、微秒（us | µs）、毫秒（ms）、秒（s）、分（m）、小时（h）、天（d）。默认为10s
            heartbeatInterval = "0s"
            # 心跳机制，默认为resp响应式心跳。可选：resp 响应式心跳 | tick 定时主推心跳
            heartbeatMechanism = "resp"

[packet]
    # 字节序，默认为big。可选：little | big
    byteOrder = "big"
    # 路由字节数，默认为2字节
    routeBytes = 4
    # 序列号字节数，默认为2字节
    seqBytes = 4
    # 消息字节数，默认为5000字节
    bufferBytes = 5000
    # 是否携带服务器心跳时间
    heartbeatTime = false

[log]
    # 日志输出级别，可选：debug | info | warn | error | fatal | panic
    level = "error"
    # 堆栈的最低输出级别，可选：debug | info | warn | error | fatal | panic
    stackLevel = "error"
    # 时间格式，标准库时间格式
    timeFormat = "2006/01/02 15:04:05.000000"
    # 输出栈的跳过深度
    callSkip = 2
    # 是否启用调用文件全路径
    callFullPath = true
    # 日志输出终端（数组和对象两种配置形式任选其一）
    terminals = ["console", "file"]
    # 控制台同步器配置
    [log.console]
        # 日志输出格式，可选：text | json
        format = "text"
    # 文件同步器配置
    [log.file]
        # 输出文件路径
        path = "./log/due.log"
        # 日志输出格式，可选：text | json
        format = "text"
        # 文件最大留存时间，d:天、h:时、m:分、s:秒
        maxAge = "7d"
        # 文件最大尺寸限制，支持单位： B | K | KB | M | MB | G | GB | T | TB | P | PB | E | EB | Z | ZB，默认为100M
        maxSize = "100M"
        # 文件翻转方式，可选：none | year | month | week | day | hour，默认为none
        rotate = "day"
        # 文件翻转时是否对文件进行压缩
        compress = false

[crypto.ecc.signer]
    # hash算法，不区分大小写。可选：SHA1 | SHA224 | SHA256 | SHA384 | SHA512
    hash = "SHA256"
    # 签名分隔符。由于ECDSA签名算法会产生两段签名串，因此需要通过分隔符将其拼接为一个签名
    delimiter = " "
    # 公钥，可设置文件路径或公钥串
    publicKey = "resource/key.pub.pem"
    # 私钥，可设置文件路径或私钥串
    privateKey = "resource/key.pem"

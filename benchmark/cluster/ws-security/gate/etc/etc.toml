timezone = "Local"

[cluster.gate]
name = "ws-security-gate"
timeout = "3s"

[network.ws.server]
addr = ":3554"
path = "/"
maxConnNum = 5000
origins = ["*"]
heartbeatInterval = "10s"
heartbeatMechanism = "resp"
writeTimeout = "10s"
enableCompression = false

[locate.redis]
addrs = ["127.0.0.1:6379"]
db = 0
prefix = "due:benchmark:ws-security"

[registry.nacos]
urls = ["http://127.0.0.1:8848/nacos"]
groupName = "due-benchmark-ws-security"

[pprof]
addr = ":8092"

[log]
level = "error"
terminals = ["console"]


services:
  nacos:
    image: nacos/nacos-server:v3.2.3
    container_name: dev-nacos
    platform: linux/x86_64
    restart: always
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
    volumes:
      - ./nacos:/home/nacos/logs
    ports:
      - '8848:8848'
      - '8880:8080'
      - '9848:9848'
    networks:
      cluster-network:
        ipv4_address: 192.168.10.2
  redis:
    image: redis:8.10.0
    container_name: dev-redis
    platform: linux/x86_64
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - ./redis:/data
    networks:
      cluster-network:
        ipv4_address: 192.168.10.3
  memcached:
    image: memcached:1.6.45
    container_name: dev-memcached
    platform: linux/x86_64
    restart: always
    ports:
      - '11211:11211'
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=4
    networks:
      cluster-network:
        ipv4_address: 192.168.10.4
  consul:
    image: consul:1.15.4
    container_name: dev-consul
    platform: linux/x86_64
    restart: always
    ports:
      - '8300:8300'
      - '8301:8301'
      - '8301:8301/udp'
      - '8500:8500'
      - '8600:8600'
      - '8600:8600/udp'
    volumes:
      - ./consul/data:/consul/data
    networks:
      cluster-network:
        ipv4_address: 192.168.10.5
  etcd:
    image: openeuler/etcd:3.6.11-oe2403sp4
    container_name: dev-etcd
    platform: linux/x86_64
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - '2379:2379'
      - '2380:2380'
    networks:
      cluster-network:
        ipv4_address: 192.168.10.6
  # nats:
  #   image: nats:latest
  #   container_name: dev-nats
  #   platform: linux/x86_64
  #   restart: always
  #   ports:
  #     - '4222:4222'
  #     - '6222:6222'
  #     - '8222:8222'
networks:
  cluster-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/24